<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/geist-latin.woff2" crossorigin />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!--
      No third-party origins. The Telegram auth key lives in this origin's
      IndexedDB, so any script that loads here can read it — analytics
      included. 'wasm-unsafe-eval' is required because mtcute compiles AES-IGE
      from WebAssembly; it permits WASM compilation only, never eval() of
      JavaScript strings.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' 'wasm-unsafe-eval';
               style-src 'self' 'unsafe-inline';
               font-src 'self';
               img-src 'self' data: blob:;
               media-src 'self' blob:;
               frame-src 'self' blob:;
               connect-src 'self' wss://*.web.telegram.org https://*.web.telegram.org;
               worker-src 'self';
               object-src 'none';
               base-uri 'self'"
    />

    <title>Open Axiom — sign in with Telegram</title>
    <meta name="description" content="Scan a QR code with Telegram to open your files. No password and no account to create." />
    <link rel="canonical" href="%VITE_SITE_URL%/app" />
    <meta name="robots" content="noindex, follow" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Axiom" />
    <meta property="og:title" content="Open Axiom — sign in with Telegram" />
    <meta property="og:description" content="Scan a QR code with Telegram to open your files. No password and no account to create." />
    <meta property="og:url" content="%VITE_SITE_URL%/app" />
    <meta property="og:image" content="%VITE_SITE_URL%/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Axiom — your cloud, your control" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Open Axiom — sign in with Telegram" />
    <meta name="twitter:description" content="Scan a QR code with Telegram to open your files. No password and no account to create." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og.jpg" />
  </head>
  <body>
    <a
      href="#main"
      style="position:absolute;left:-9999px;top:0;padding:1rem;background:#fff;z-index:100"
      onfocus="this.style.left='0'"
      onblur="this.style.left='-9999px'"
      >Skip to content</a
    >
    <div id="root"></div>
    <script type="module" src="/src/entries/app.tsx"></script>
  </body>
</html>
