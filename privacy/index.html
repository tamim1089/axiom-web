    <script>
      // Applied before first paint so a dark-theme visitor never gets a white
      // flash while the bundle loads. Mirrors applyTheme() in theme-switcher.
      (function () {
        try {
          var t = localStorage.getItem('axiom.theme') || 'system'
          var dark =
            t === 'dark' ||
            (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.add(dark ? 'dark' : 'light')
        } catch (e) {
          document.documentElement.classList.add('light')
        }
      })()
    </script>
